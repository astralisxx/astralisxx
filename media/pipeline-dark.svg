<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Project pipeline</title>
  <desc id="dsc">Test-rig experiments feed a check-valve model and a wall heat-transfer condition, each built from tests plus CFD; steady housing tests give the heat-transfer value and transient cool-down tests show that one constant coefficient is valid. Both feed a thermodynamic compressor model and a cylinder CFD model, which cross-check each other and are validated against rig pressure and flow. The thermodynamic model is ported to Python, parity-tested, and becomes a booster simulator with inverse design.</desc>
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #121820; stroke: #2a3038; stroke-width: 1.5; }
    .panel { fill: #10151c; stroke: #262c34; stroke-width: 1.5; }
    .sep { stroke: #2a3038; stroke-width: 1.5; }
    .t { fill: #e6edf3; font-size: 24px; font-weight: 600; }
    .s { fill: #9aa4b0; font-size: 20px; }
    .cap { fill: #e6edf3; font-size: 20px; font-weight: 600; letter-spacing: 2px; }
    .lbl { fill: #9aa4b0; font-size: 20px; }
    .tag { fill: #121820; stroke: #2a3038; stroke-width: 1.5; }
    .tagt { fill: #9aa4b0; font-size: 19px; font-weight: 600; letter-spacing: 1px; }
    .track { fill: none; stroke: url(#jet); stroke-width: 3; opacity: 0.26; }
    .flow { fill: none; stroke: url(#jet); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 10 14; animation: flow 3s linear infinite; }
    .head { fill: url(#jet); }
    .port { fill: #121820; stroke: url(#jet); stroke-width: 2.5; }
    .halo { fill: none; stroke: url(#jet); stroke-width: 2; opacity: 0.12;
            animation: halo 3s ease-in-out infinite; }
    .shadow { flood-color: #000000; flood-opacity: 0.45; }
    .j0 { stop-color: #2f62e8; }
    .j1 { stop-color: #1f86f0; }
    .j2 { stop-color: #22aedd; }
    .j3 { stop-color: #23c6a4; }
    .j4 { stop-color: #57d873; }
    .j5 { stop-color: #b9d842; }
    .j6 { stop-color: #efba23; }
    .j7 { stop-color: #ee7a2a; }
    @keyframes flow { to { stroke-dashoffset: -96; } }
    @keyframes halo { 50% { opacity: 0.50; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="jet" gradientUnits="userSpaceOnUse" x1="288" y1="0" x2="1276" y2="0">
      <stop class="j0" offset="0"/>
      <stop class="j1" offset="0.15"/>
      <stop class="j2" offset="0.3"/>
      <stop class="j3" offset="0.45"/>
      <stop class="j4" offset="0.6"/>
      <stop class="j5" offset="0.72"/>
      <stop class="j6" offset="0.84"/>
      <stop class="j7" offset="1"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow class="shadow" dx="0" dy="2" stdDeviation="5"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="560"/>

  <g id="captions">
    <text class="cap" x="32" y="40">TEST RIG</text>
    <text class="cap" x="384" y="40">CHARACTERISATION</text>
    <text class="cap" x="776" y="40">COMPRESSOR MODELS</text>
    <text class="cap" x="1276" y="40">SIMULATOR</text>
  </g>

