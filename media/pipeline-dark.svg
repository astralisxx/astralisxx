    .box { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
    .frame { fill: none; stroke: #3d444d; stroke-width: 1.5; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .t { fill: #f0f6fc; font-size: 23px; font-weight: 600; }
    .s { fill: #9198a1; font-size: 19px; }
    .cap { fill: #9198a1; font-size: 18px; font-weight: 600; }
    .lbl { fill: #9198a1; font-size: 18px; }
    .tag { fill: none; stroke: #3d444d; stroke-width: 1.25; }
    .tagt { fill: #9198a1; font-size: 14px; font-weight: 600; }
    .ln { fill: none; stroke: #6e7681; stroke-width: 2; }
    .dl { fill: none; stroke: #6e7681; stroke-width: 2; stroke-dasharray: 5 6; }
    .hd, .dot { fill: #6e7681; }
    .amber { fill: #d29922; fill-opacity: 0.12; stroke: #d29922; stroke-opacity: 0.6; stroke-width: 1.5; }
    .blue { fill: #4493f8; fill-opacity: 0.12; stroke: #4493f8; stroke-opacity: 0.6; stroke-width: 1.5; }
    .purple { fill: #ab7df8; fill-opacity: 0.12; stroke: #ab7df8; stroke-opacity: 0.6; stroke-width: 1.5; }
  </style>
