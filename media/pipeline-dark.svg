    <rect class="card" x="794" y="248" width="336" height="104" rx="14" filter="url(#sh)"/>
    <text class="t" x="818" y="294">3-D cylinder CFD</text>
    <text class="s" x="818" y="324">ANSYS Fluent</text>
    <rect class="halo" x="1271" y="75" width="302" height="114" rx="19"/>
    <rect class="card" x="1276" y="80" width="292" height="104" rx="14" filter="url(#sh)"/>
    <text class="t" x="1300" y="126">Booster simulator</text>
    <text class="s" x="1300" y="156">desktop · inverse design</text>
  </g>

